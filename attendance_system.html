<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AttendTrack — School Attendance System</title>
<link rel="icon" type="image/jpeg" href="99.jpg">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.30.0/dist/tabler-icons.min.css">
<link rel="stylesheet" href="attendance_system.css">
</head>
<body>

<div id="login-page">
  <a href="my-portfolio.html" class="portfolio-link" title="View PHEAP PHIROM Portfolio">
    <img src="Picture1.png" class="page-logo" alt="PHEAP PHIROM Portfolio">
  </a>
  <div class="login-card">
    <div class="login-logo">
      <div class="logo-icon"><i class="ti ti-calendar-check"></i></div>
      <div>
        <h2>AttendTrack</h2>
        <span>School Attendance System</span>
      </div>
    </div>
    <div id="login-alert" class="hidden alert alert-danger">Invalid credentials. Try again.</div>
    <div id="recovery-alert" class="hidden alert"></div>
    <div class="login-tabs">
      <button class="login-tab active" onclick="switchRole('admin')">Admin</button>
      <button class="login-tab" onclick="switchRole('teacher')">Teacher</button>
      <button class="login-tab" onclick="switchRole('student')">Student</button>
    </div>
    <form id="login-form" onsubmit="event.preventDefault(); doLogin();">
      <div class="form-group">
      <label>Email</label>
      <input type="email" id="login-email" placeholder="Enter your email">
      </div>
      <div class="form-group">
        <label>Password</label>
        <div class="password-wrap">
          <input type="password" id="login-password" placeholder="Enter your password">
          <button type="button" class="password-toggle" data-target="login-password" aria-label="Show password" onclick="togglePasswordVisibility(this)">
            <i class="ti ti-eye"></i>
          </button>
        </div>
      </div>
      <button type="submit" class="btn btn-primary login-submit"><i class="ti ti-login"></i> Sign In</button>
      <button class="forgot-link" type="button" onclick="showRecovery()"><i class="ti ti-key"></i> Forgot password?</button>
    </form>

    <form id="recovery-form" class="hidden" onsubmit="event.preventDefault(); recoverPassword();">
      <div class="form-group">
        <label>Registered Email</label>
        <input type="email" id="recovery-email" placeholder="Enter your account email">
      </div>
      <div class="form-group">
        <label>New Password</label>
        <div class="password-wrap">
          <input type="password" id="recovery-password" placeholder="Create a new password">
          <button type="button" class="password-toggle" data-target="recovery-password" aria-label="Show password" onclick="togglePasswordVisibility(this)">
            <i class="ti ti-eye"></i>
          </button>
        </div>
      </div>
      <div class="form-group">
        <label>Confirm Password</label>
        <div class="password-wrap">
          <input type="password" id="recovery-confirm" placeholder="Confirm new password">
          <button type="button" class="password-toggle" data-target="recovery-confirm" aria-label="Show password" onclick="togglePasswordVisibility(this)">
            <i class="ti ti-eye"></i>
          </button>
        </div>
      </div>
      <button type="submit" class="btn btn-primary login-submit"><i class="ti ti-device-floppy"></i> Reset Password</button>
      <button class="forgot-link" type="button" onclick="showLogin()"><i class="ti ti-arrow-left"></i> Back to sign in</button>
    </form>
  </div>
</div>

<div id="app-layout" class="hidden">
  <div class="sidebar">
    <div class="sidebar-logo">
      <h2><i class="ti ti-calendar-check"></i> <span>AttendTrack</span></h2>
      <span class="role-badge" id="role-badge">Admin</span>
    </div>
    <div class="sidebar-user">
      <div class="avatar" id="user-avatar">A</div>
      <div>
        <div class="sidebar-user-name" id="user-name-display">Admin</div>
        <div class="sidebar-user-email" id="user-email-display">phirom007kh@gmail.com</div>
      </div>
    </div>
    <nav class="sidebar-nav" id="sidebar-nav"></nav>
    <div class="sidebar-footer">
      <button class="nav-item" onclick="logout()"><i class="ti ti-logout"></i><span>Sign out</span></button>
    </div>
  </div>

  <div class="main-content" id="main-content"></div>
</div>

<div class="modal-overlay hidden" id="modal-overlay" onclick="closeModal(event)">
  <div class="modal" id="modal-box">
    <div class="modal-header">
      <h3 id="modal-title">Modal</h3>
      <button class="close-btn" onclick="closeModal()"><i class="ti ti-x"></i></button>
    </div>
    <div id="modal-body"></div>
  </div>
</div>

<script src="shared-utils.js"></script>
<script>
initData();
let selectedRole = 'admin';

function switchRole(role) {
  selectedRole = role;
  document.querySelectorAll('.login-tab').forEach((t,i)=>t.classList.toggle('active',['admin','teacher','student'][i]===role));
  clearAuthAlerts();
  
  const demoEmails = { admin: 'phirom007kh@gmail.com', teacher: 'teacher@school.com', student: 'student@school.com' };
  const demoPwds = { admin: 'nha061106', teacher: 'teach123', student: 'stu123' };
  
  document.getElementById('login-email').value = demoEmails[role] || '';
  document.getElementById('login-password').value = demoPwds[role] || '';
  document.getElementById('recovery-email').value = '';
  document.getElementById('recovery-password').value = '';
  document.getElementById('recovery-confirm').value = '';
}

function clearAuthAlerts() {
  document.getElementById('login-alert').classList.add('hidden');
  const alert = document.getElementById('recovery-alert');
  alert.className = 'hidden alert';
  alert.textContent = '';
}

function togglePasswordVisibility(button) {
  const targetId = button.dataset.target;
  const input = document.getElementById(targetId);
  const icon = button.querySelector('i');
  const isHidden = input.type === 'password';

  input.type = isHidden ? 'text' : 'password';
  icon.classList.toggle('ti-eye', !isHidden);
  icon.classList.toggle('ti-eye-off', isHidden);
  button.setAttribute('aria-label', isHidden ? 'Hide password' : 'Show password');
}

function setRecoveryAlert(message, type) {
  const alert = document.getElementById('recovery-alert');
  alert.className = `alert alert-${type}`;
  alert.textContent = message;
}

function showRecovery() {
  clearAuthAlerts();
  document.getElementById('login-form').classList.add('hidden');
  document.getElementById('recovery-form').classList.remove('hidden');
  document.getElementById('recovery-email').focus();
}

function showLogin() {
  clearAuthAlerts();
  document.getElementById('recovery-form').classList.add('hidden');
  document.getElementById('login-form').classList.remove('hidden');
  document.getElementById('login-email').focus();
}

async function doLogin() {
  const email = document.getElementById('login-email').value.trim();
  const pw = document.getElementById('login-password').value;
  const role = selectedRole;
  const alertEl = document.getElementById('login-alert');

  if (!email || !pw) {
    alertEl.textContent = 'Please enter email and password.';
    alertEl.classList.remove('hidden');
    return;
  }

  try {
    const res = await fetch(`${API_URL}/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password: pw, role })
    });

    const data = await res.json();

    if (res.ok && data.success) {
      alertEl.classList.add('hidden');
      setToken(data.token);
      setCurrentUser(data.user);
      const redirects = { admin: 'admin-dashboard.html', teacher: 'teacher-dashboard.html', student: 'student-dashboard.html' };
      window.location.href = redirects[data.user.role] || 'admin-dashboard.html';
      return;
    } else {
      alertEl.textContent = data.message || 'Invalid credentials or role. Please try again.';
      alertEl.classList.remove('hidden');
    }
  } catch (err) {
    console.warn('Backend API login error:', err);
    alertEl.textContent = 'Server connection error. Please make sure the server is running.';
    alertEl.classList.remove('hidden');
  }
}

async function recoverPassword() {
  const email = document.getElementById('recovery-email').value.trim();
  const newPassword = document.getElementById('recovery-password').value;
  const confirmPassword = document.getElementById('recovery-confirm').value;

  if (!email || !newPassword || !confirmPassword) {
    setRecoveryAlert('Please fill in every recovery field.', 'danger');
    return;
  }

  if (newPassword.length < 6) {
    setRecoveryAlert('Password must be at least 6 characters.', 'danger');
    return;
  }

  if (newPassword !== confirmPassword) {
    setRecoveryAlert('Passwords do not match.', 'danger');
    return;
  }

  try {
    const res = await fetch(`${API_URL}/auth/recover-password`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, newPassword, role: selectedRole })
    });

    const data = await res.json();
    if (res.ok && data.success) {
      document.getElementById('login-email').value = email;
      document.getElementById('login-password').value = '';
      showLogin();
      setRecoveryAlert('Password recovered successfully. Sign in with your new password.', 'success');
    } else {
      setRecoveryAlert(data.message || 'Password recovery failed.', 'danger');
    }
  } catch (err) {
    console.error('Password recovery error:', err);
    setRecoveryAlert('Server connection error. Please try again.', 'danger');
  }
}

switchRole('admin');
</script>
</body>
</html>
