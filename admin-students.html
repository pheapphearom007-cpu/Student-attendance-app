<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage Students — AttendTrack</title>
<link rel="icon" type="image/jpeg" href="99.jpg">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.30.0/dist/tabler-icons.min.css">
<link rel="stylesheet" href="attendance_system.css">
</head>
<body>

<!-- ===== APP LAYOUT ===== -->
<div id="app-layout" class="app-layout">
  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-logo">
      <h2><i class="ti ti-calendar-check"></i> <span>AttendTrack</span></h2>
      <span class="role-badge" id="role-badge">Admin</span>
    </div>
    <div class="sidebar-user">
      <div class="avatar" id="user-avatar">A</div>
      <div>
        <div class="sidebar-user-name" id="user-name-display">Admin</div>
        <div class="sidebar-user-email" id="user-email-display">phirom007kh@gmail.com</div>
      </div>
    </div>
    <nav class="sidebar-nav" id="sidebar-nav"></nav>
    <div class="sidebar-footer">
      <button class="nav-item" onclick="logout()"><i class="ti ti-logout"></i><span>Sign out</span></button>
    </div>
  </div>

  <!-- Main -->
  <div class="main-content" id="main-content">
    <div class="page-header"><h1>Manage Students</h1><p>Add, edit, or remove students from the system.</p></div>
    <div class="search-bar">
      <input type="text" placeholder="Search students..." id="student-search" oninput="renderStudents(this.value)">
      <button class="btn btn-primary" onclick="openStudentModal()"><i class="ti ti-user-plus"></i> Add Student</button>
    </div>
    <div class="card">
      <table>
        <thead><tr><th>Name</th><th>Email</th><th>Class</th><th>Phone</th><th>Actions</th></tr></thead>
        <tbody id="students-table"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- ===== MODAL ===== -->
<div class="modal-overlay hidden" id="modal-overlay" onclick="closeModal(event)">
  <div class="modal" id="modal-box">
    <div class="modal-header">
      <h3 id="modal-title">Modal</h3>
      <button class="close-btn" onclick="closeModal()"><i class="ti ti-x"></i></button>
    </div>
    <div id="modal-body"></div>
  </div>
</div>

<script src="shared-utils.js"></script>
<script src="admin-students.js"></script>
<script>
if (!checkAuth()) throw new Error('Unauthorized');

function renderStudents(search='') {
  let students = DB.get('students');
  if (search) students = students.filter(s=>s.name.toLowerCase().includes(search.toLowerCase())||s.email.toLowerCase().includes(search));
  const classes = DB.get('classes');
  
  document.getElementById('students-table').innerHTML = students.map(s=>{
    const cl = classes.find(c=>c.id===s.class_id)||{name:'—'};
    return `<tr>
      <td><strong style="font-weight:500">${escapeHtml(s.name)}</strong></td>
      <td style="color:var(--gray-600)">${escapeHtml(s.email)}</td>
      <td><span class="badge badge-excused">${escapeHtml(cl.name)}</span></td>
      <td style="color:var(--gray-600)">${escapeHtml(s.phone||'—')}</td>
      <td>
        <button class="btn btn-secondary btn-sm" onclick="openStudentModal(${s.id})"><i class="ti ti-edit"></i> Edit</button>
        <button class="btn btn-danger btn-sm" style="margin-left:4px" onclick="deleteStudent(${s.id})"><i class="ti ti-trash"></i></button>
      </td>
    </tr>`;
  }).join('') || '<tr><td colspan="5"><div class="empty-state"><i class="ti ti-users-off"></i><p>No students found.</p></div></td></tr>';
}

renderStudents();
</script>
</body>
</html>
