<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Attendance — AttendTrack</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.30.0/dist/tabler-icons.min.css">
<link rel="stylesheet" href="attendance_system.css">
</head>
<body>

<div id="app-layout" class="app-layout">
  <div class="sidebar">
    <div class="sidebar-logo">
      <h2><i class="ti ti-calendar-check"></i> <span>AttendTrack</span></h2>
      <span class="role-badge" id="role-badge">Student</span>
    </div>
    <div class="sidebar-user">
      <div class="avatar" id="user-avatar">S</div>
      <div>
        <div class="sidebar-user-name" id="user-name-display">Student</div>
        <div class="sidebar-user-email" id="user-email-display">student@school.com</div>
      </div>
    </div>
    <nav class="sidebar-nav" id="sidebar-nav"></nav>
    <div class="sidebar-footer">
      <button class="nav-item" onclick="logout()"><i class="ti ti-logout"></i><span>Sign out</span></button>
    </div>
  </div>

  <div class="main-content" id="main-content">
    <div class="page-header"><h1>My Attendance</h1><p>Full attendance history.</p></div>
    <div class="card">
      <div style="margin-bottom:12px;display:flex;gap:8px">
        <select id="s-status" onchange="filterAttendance()" style="width:140px">
          <option value="">All Statuses</option>
          <option value="present">Present</option>
          <option value="absent">Absent</option>
          <option value="late">Late</option>
          <option value="excused">Excused</option>
        </select>
        <input type="month" id="s-month" onchange="filterAttendance()" style="width:150px">
      </div>
      <div id="s-att-table"></div>
    </div>
  </div>
</div>

<div class="modal-overlay hidden" id="modal-overlay" onclick="closeModal(event)">
  <div class="modal" id="modal-box">
    <div class="modal-header">
      <h3 id="modal-title">Modal</h3>
      <button class="close-btn" onclick="closeModal()"><i class="ti ti-x"></i></button>
    </div>
    <div id="modal-body"></div>
  </div>
</div>

<script src="shared-utils.js"></script>
<script>
if (!checkAuth()) throw new Error('Unauthorized');

const user = getCurrentUser();
const att = DB.get('attendance').filter(a=>a.student_id===user.id);
document.getElementById('s-att-table').innerHTML = recentAttTable(att.slice().reverse());

function filterAttendance() {
  const status = document.getElementById('s-status').value;
  const month = document.getElementById('s-month').value;
  let filtered = DB.get('attendance').filter(a=>a.student_id===user.id);
  if (status) filtered = filtered.filter(a=>a.status===status);
  if (month) filtered = filtered.filter(a=>a.date.startsWith(month));
  document.getElementById('s-att-table').innerHTML = recentAttTable(filtered.slice().reverse());
}
</script>
</body>
</html>
