<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage Teachers — AttendTrack</title>
<link rel="icon" type="image/jpeg" href="99.jpg">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.30.0/dist/tabler-icons.min.css">
<link rel="stylesheet" href="attendance_system.css">
</head>
<body>

<div id="app-layout" class="app-layout">
  <div class="sidebar">
    <div class="sidebar-logo">
      <h2><i class="ti ti-calendar-check"></i> <span>AttendTrack</span></h2>
      <span class="role-badge" id="role-badge">Admin</span>
    </div>
    <div class="sidebar-user">
      <div class="avatar" id="user-avatar">A</div>
      <div>
        <div class="sidebar-user-name" id="user-name-display">Admin</div>
        <div class="sidebar-user-email" id="user-email-display">phirom007kh@gmail.com</div>
      </div>
    </div>
    <nav class="sidebar-nav" id="sidebar-nav"></nav>
    <div class="sidebar-footer">
      <button class="nav-item" onclick="logout()"><i class="ti ti-logout"></i><span>Sign out</span></button>
    </div>
  </div>

  <div class="main-content" id="main-content">
    <div class="page-header"><h1>Manage Teachers</h1><p>Add, edit, or remove teachers.</p></div>
    <div style="margin-bottom:16px"><button class="btn btn-primary" onclick="openTeacherModal()"><i class="ti ti-user-plus"></i> Add Teacher</button></div>
    <div class="card">
      <table>
        <thead><tr><th>Name</th><th>Email</th><th>Subject</th><th>Classes</th><th>Actions</th></tr></thead>
        <tbody id="teachers-table"></tbody>
      </table>
    </div>
  </div>
</div>

<div class="modal-overlay hidden" id="modal-overlay" onclick="closeModal(event)">
  <div class="modal" id="modal-box">
    <div class="modal-header">
      <h3 id="modal-title">Modal</h3>
      <button class="close-btn" onclick="closeModal()"><i class="ti ti-x"></i></button>
    </div>
    <div id="modal-body"></div>
  </div>
</div>

<script src="shared-utils.js"></script>
<script src="admin-teachers.js"></script>
<script>
if (!checkAuth()) throw new Error('Unauthorized');

function renderTeachers() {
  const teachers = DB.get('teachers');
  const classes = DB.get('classes');
  document.getElementById('teachers-table').innerHTML = teachers.map(t=>{
    const tc = classes.filter(c=>c.teacher_id===t.id);
    return `<tr>
      <td><strong style="font-weight:500">${escapeHtml(t.name)}</strong></td>
      <td style="color:var(--gray-600)">${escapeHtml(t.email)}</td>
      <td>${escapeHtml(t.subject||'—')}</td>
      <td>${tc.map(c=>`<span class="badge badge-excused" style="margin-right:4px">${escapeHtml(c.name)}</span>`).join('')||'—'}</td>
      <td>
        <button class="btn btn-secondary btn-sm" onclick="openTeacherModal(${t.id})"><i class="ti ti-edit"></i> Edit</button>
        <button class="btn btn-danger btn-sm" style="margin-left:4px" onclick="deleteTeacher(${t.id})"><i class="ti ti-trash"></i></button>
      </td>
    </tr>`;
  }).join('')||'<tr><td colspan="5"><div class="empty-state"><i class="ti ti-user-off"></i><p>No teachers yet.</p></div></td></tr>';
}

renderTeachers();
</script>
</body>
</html>
